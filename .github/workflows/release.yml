name: Release

# A tag names exactly one package: `scampjs@0.1.0`, `create-scampjs@0.1.0`,
# `@scampjs/adapter-cloudflare@0.1.0`. The job checks the tag's version
# against the workspace's package.json, builds, and publishes that one
# workspace.
#
# Publishes through npm trusted publishing: no stored token. The
# `id-token: write` permission lets the job mint an OIDC token, and each
# package's settings on npmjs.com name this repository and workflow file
# as its trusted publisher. `--provenance` attaches the build attestation.
on:
  push:
    tags:
      - '*@*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Parse tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="${tag%@*}"
          version="${tag##*@}"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Check version matches package.json
        run: |
          actual=$(npm pkg get version -w "${{ steps.tag.outputs.package }}" | tr -d '"{}\n ' | sed 's/.*://')
          if [ "$actual" != "${{ steps.tag.outputs.version }}" ]; then
            echo "tag says ${{ steps.tag.outputs.version }} but package.json says $actual"
            exit 1
          fi

      - run: npm run build -w "${{ steps.tag.outputs.package }}" --if-present
      - run: npm test

      # Publish from inside the package directory rather than with -w, which
      # is the form npm's trusted-publishing docs describe.
      - name: Publish
        run: |
          dir=$(npm query ".workspace[name='${{ steps.tag.outputs.package }}']" | node -e "const [w]=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!w){process.exit(1)} console.log(w.path)")
          cd "$dir"
          npm publish --access public --provenance
