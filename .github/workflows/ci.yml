name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The adapter's types come from the framework's dist, so build first.
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Proves every workspace packs cleanly without asking the registry
      # (a publish dry run refuses once the version exists). Real publishes
      # happen from release.yml on a `<package>@<version>` tag.
      - run: npm run pack:dry
